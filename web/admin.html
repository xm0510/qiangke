const $=id=>document.getElementById(id);async function api(method,path,body){const o={method,headers:{'Content-Type':'application/json'}};if(body)o.body=JSON.stringify(body);const r=await fetch(path,o);let j={};try{j=await r.json()}catch(e){}if(r.status===401){location.href='/login.html';return{ok:false}}return j}
async function init(){const me=await api('GET','/api/auth/me');if(!me.ok||!me.user)return;if(Number(me.user.is_admin)!==1){$('forbidden').style.display='block';return}$('adminContent').hidden=false;$('adminPhone').textContent=me.user.phone||'';const j=await api('GET','/api/auth/admin/invite-code');if(j.ok)$('inviteCode').value=j.invite_code||''}
async function saveInvite(){const v=$('inviteCode').value.trim();if(!v){$('inviteStatus').textContent='\u9080\u8bf7\u7801\u4e0d\u80fd\u4e3a\u7a7a';return}const j=await api('POST','/api/auth/admin/invite-code',{invite_code:v});$('inviteStatus').textContent=j.ok?'\u9080\u8bf7\u7801\u5df2\u66f4\u65b0':(j.error||'\u4fdd\u5b58\u5931\u8d25')}
async function createReset(){const phone=$('targetPhone').value.trim();const j=await api('POST','/api/auth/admin/reset-code',{phone});if(j.ok){$('resetCode').value=j.reset_code||'';$('resetStatus').textContent='\u91cd\u7f6e\u7801\u5df2\u751f\u6210\uff0c\u8bf7\u5355\u72ec\u53d1\u7ed9\u8be5\u7528\u6237'}else{$('resetCode').value='';$('resetStatus').textContent=j.error||'\u751f\u6210\u5931\u8d25'}}
async function copyValue(id){const v=$(id).value;if(!v)return;await navigator.clipboard.writeText(v);const status=id==='inviteCode'?'inviteStatus':'resetStatus';$(status).textContent='\u5df2\u590d\u5236'}async function logout(){await api('POST','/api/auth/logout');location.href='/login.html'}$('menuBtn').onclick=()=>{const n=$('mainNav'),open=n.classList.toggle('open');$('menuBtn').setAttribute('aria-expanded',String(open))};init();
