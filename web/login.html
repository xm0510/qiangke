<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>登录｜巷陌课表</title>
<style>
:root{--p:#7c3aed;--p2:#a855f7;--text:#17122b;--muted:#6b7280;--line:#e9e4fb;--soft:#faf8ff}*{box-sizing:border-box;margin:0;padding:0}body{min-height:100vh;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Microsoft YaHei",sans-serif;background:radial-gradient(circle at 20% 10%,#ede9fe,#f8fafc 45%,#f5f3ff);color:var(--text);display:grid;place-items:center;padding:24px}.box{width:min(980px,100%);display:grid;grid-template-columns:1.1fr .9fr;gap:24px}.hero,.card{background:rgba(255,255,255,.9);border:1px solid rgba(124,58,237,.12);border-radius:28px;box-shadow:0 24px 70px rgba(49,26,110,.13)}.hero{padding:38px;background:linear-gradient(135deg,#5b21b6,#7c3aed 60%,#c084fc);color:white}.logo{width:54px;height:54px;border-radius:18px;background:rgba(255,255,255,.18);display:grid;place-items:center;font-weight:950;margin-bottom:22px}.hero h1{font-size:42px;line-height:1.1;margin-bottom:14px}.hero p{color:#ede9fe;font-size:16px}.points{display:grid;gap:12px;margin-top:28px}.pt{background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.16);border-radius:16px;padding:12px}.card{padding:30px}.card h2{font-size:24px;margin-bottom:6px}.tip{font-size:13px;color:var(--muted);margin-bottom:22px}.row{margin-bottom:14px}.row label{display:block;font-size:13px;color:#5b5570;font-weight:900;margin-bottom:7px}.row input{width:100%;border:1.5px solid var(--line);border-radius:15px;padding:13px 14px;font-size:15px;outline:0}.row input:focus{border-color:var(--p2);box-shadow:0 0 0 4px rgba(168,85,247,.12)}.btn{width:100%;border:0;border-radius:15px;padding:13px 16px;background:linear-gradient(135deg,var(--p),var(--p2));color:white;font-weight:950;font-size:15px;cursor:pointer}.btn:hover{transform:translateY(-1px)}.small{font-size:12px;color:var(--muted);line-height:1.7;margin-top:14px}.err{color:#ef4444;font-size:13px;min-height:22px;margin-top:10px}.back{display:inline-block;margin-top:18px;color:#6d28d9;font-size:13px;text-decoration:none}@media(max-width:820px){.box{grid-template-columns:1fr}.hero h1{font-size:32px}}
.mode-tabs{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-bottom:18px}.mode-tab{border:1px solid var(--line);background:white;color:#6b5c80;border-radius:12px;padding:9px 5px;font-weight:850;cursor:pointer}.mode-tab.active{background:#ede9fe;color:#6d28d9;border-color:#c4b5fd}.hidden{display:none}</style>
</head>
<body><main class="box"><section class="hero"><div class="logo">&#35838;</div><h1>&#30331;&#24405;&#24055;&#38476;&#35838;&#34920;</h1><p>&#20813;&#36153;&#30340;&#36134;&#21495;&#23494;&#30721;&#30331;&#24405;&#65292;&#27599;&#20010;&#29992;&#25143;&#30340;&#25968;&#25454;&#30456;&#20114;&#38548;&#31163;&#12290;</p><div class="points"><div class="pt">&#23494;&#30721;&#20351;&#29992; scrypt &#23433;&#20840;&#21704;&#24076;</div><div class="pt">&#39318;&#27425;&#27880;&#20876;&#38656;&#35201;&#31649;&#29702;&#21592;&#36992;&#35831;&#30721;</div><div class="pt">&#24536;&#35760;&#23494;&#30721;&#21487;&#20351;&#29992;&#31649;&#29702;&#21592;&#19968;&#27425;&#24615;&#37325;&#32622;&#30721;</div></div></section><section class="card"><h2>&#36134;&#21495;&#30331;&#24405;</h2><div class="tip">&#26087;&#36134;&#21495;&#39318;&#27425;&#20351;&#29992;&#26032;&#29256;&#26102;&#65292;&#35831;&#36873;&#25321;&#8220;&#39318;&#27425;&#27880;&#20876;&#8221;&#35774;&#32622;&#23494;&#30721;&#12290;</div><div class="mode-tabs"><button class="mode-tab active" data-mode="login" onclick="setMode('login')">&#30331;&#24405;</button><button class="mode-tab" data-mode="register" onclick="setMode('register')">&#39318;&#27425;&#27880;&#20876;</button><button class="mode-tab" data-mode="reset" onclick="setMode('reset')">&#37325;&#32622;&#23494;&#30721;</button></div><div class="row"><label>&#25163;&#26426;&#21495;</label><input id="phone" placeholder="&#20316;&#20026;&#30331;&#24405;&#36134;&#21495;" autocomplete="username" inputmode="tel" maxlength="11"></div><div class="row"><label>&#23494;&#30721;</label><input id="password" type="password" placeholder="&#33267;&#23569; 8 &#20301;" autocomplete="current-password" maxlength="128"></div><div class="row hidden" id="inviteRow"><label>&#36992;&#35831;&#30721;</label><input id="inviteCode" placeholder="&#21521;&#31649;&#29702;&#21592;&#33719;&#21462;"></div><div class="row hidden" id="resetRow"><label>&#19968;&#27425;&#24615;&#37325;&#32622;&#30721;</label><input id="resetCode" placeholder="10 &#20301;&#19968;&#27425;&#24615;&#37325;&#32622;&#30721;" autocomplete="one-time-code" autocapitalize="characters" oninput="this.value=normalizeResetCodeValue(this.value)"></div><button class="btn" id="submitBtn" onclick="submitAuth()">&#30331;&#24405;</button><div class="err" id="err"></div><div class="small">&#26087;&#36134;&#21495;&#39318;&#27425;&#20351;&#29992;&#26032;&#29256;&#26102;&#65292;&#35831;&#36873;&#25321;&#8220;&#39318;&#27425;&#27880;&#20876;&#8221;&#35774;&#32622;&#23494;&#30721;&#12290;</div><a class="back" href="/landing.html">&#36820;&#22238;&#20171;&#32461;&#39029;</a></section></main>
<script>
var authMode='login';
var RESET_CODE_ALPHABET='ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
function normalizeResetCodeValue(v){return String(v||'').toUpperCase().split('').filter(function(ch){return RESET_CODE_ALPHABET.indexOf(ch)>=0}).join('').slice(0,10)}
function setError(message){document.getElementById('err').textContent=message||''}
function setMode(mode){authMode=mode;setError('');document.querySelectorAll('.mode-tab').forEach(function(b){b.classList.toggle('active',b.dataset.mode===mode)});document.getElementById('inviteRow').classList.toggle('hidden',mode!=='register');document.getElementById('resetRow').classList.toggle('hidden',mode!=='reset');document.getElementById('submitBtn').textContent=mode==='login'?'\u767b\u5f55':mode==='register'?'\u6ce8\u518c / \u8bbe\u7f6e\u5bc6\u7801':'\u91cd\u7f6e\u5bc6\u7801';document.getElementById('password').autocomplete=mode==='login'?'current-password':'new-password'}
async function submitAuth(){setError('');var phone=document.getElementById('phone').value.trim(),password=document.getElementById('password').value;if(!/^1[3-9]\d{9}$/.test(phone)){setError('\u8bf7\u8f93\u5165\u6b63\u786e\u624b\u673a\u53f7');return}if(password.length<8){setError('\u5bc6\u7801\u81f3\u5c11\u9700\u8981 8 \u4f4d');return}var path='/api/auth/login',body={phone:phone,password:password};if(authMode==='register'){path='/api/auth/register';body.invite_code=document.getElementById('inviteCode').value.trim()}else if(authMode==='reset'){path='/api/auth/reset-password';body.reset_code=normalizeResetCodeValue(document.getElementById('resetCode').value)}try{var r=await fetch(path,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)}),j=await r.json();if(j.ok){localStorage.setItem('xm_user',JSON.stringify(j.user));location.href=Number(j.user&&j.user.is_admin)===1?'/admin':'/schedule'}else setError(j.error||'\u64cd\u4f5c\u5931\u8d25')}catch(e){setError('\u7f51\u7edc\u5f02\u5e38\uff0c\u8bf7\u7a0d\u540e\u91cd\u8bd5')}}
document.getElementById('password').addEventListener('keydown',function(e){if(e.key==='Enter')submitAuth()});
(function applyResetLink(){var q=new URLSearchParams(location.search);if(q.get('mode')==='reset'){document.getElementById('phone').value=q.get('phone')||'';document.getElementById('resetCode').value=normalizeResetCodeValue(q.get('code')||'');setMode('reset')}})();
</script></body></html>
