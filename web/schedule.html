var all=[],weekStart=startOfWeek(new Date()),calYear=new Date().getFullYear(),calMonth=new Date().getMonth(),reviewParent=null;var days={1:'周一',2:'周二',3:'周三',4:'周四',5:'周五',6:'周六',7:'周日'};var statusText={pending:'待确认',confirmed:'已确认',completed:'已完成'};var colors={'词汇':'c0','阅读':'c1','语法':'c2','完型':'c3','听口':'c4','写作':'c5','抗遗忘':'c6','其他':'c0'};var lixiao=[1,2,3,6,9,12,15,17,19,21],custom=[1,3,7,14];
var token=localStorage.getItem('xm_token')||'';var user=null;if(!token)location.href='/login.html';try{user=JSON.parse(localStorage.getItem('xm_user')||'null')}catch(e){}if(user&&document.getElementById('userBadge'))userBadge.textContent=user.phone||user.nickname||'';async function checkLogin(){var r=await fetch('/api/auth/me',{headers:{Authorization:'Bearer '+token}});if(!r.ok){localStorage.removeItem('xm_token');location.href='/login.html';return}var j=await r.json();if(j.user){user=j.user;localStorage.setItem('xm_user',JSON.stringify(user));if(document.getElementById('userBadge'))userBadge.textContent=user.phone||user.nickname||''}}async function logout(){try{await fetch('/api/auth/logout',{method:'POST',headers:{Authorization:'Bearer '+token}})}catch(e){}localStorage.removeItem('xm_token');localStorage.removeItem('xm_user');location.href='/login.html'}
function esc(s){return String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function iso(d){return d.toISOString().slice(0,10)}function today(){return iso(new Date())}function startOfWeek(d){var x=new Date(d);var w=x.getDay()||7;x.setDate(x.getDate()-w+1);x.setHours(0,0,0,0);return x}async function api(method,path,body){var opt={method,headers:{'Content-Type':'application/json',Authorization:'Bearer '+token}};if(body)opt.body=JSON.stringify(body);var r=await fetch(path,opt);if(r.status===401){localStorage.removeItem('xm_token');location.href='/login.html';return {ok:false}}return r.json()}function endTime(t,dur){var p=(t||'20:00').split(':'),m=(+p[0])*60+(+p[1])+(+dur||60);return String(Math.floor(m/60)%24).padStart(2,'0')+':'+String(m%60).padStart(2,'0')}function occurs(e,d){if(e.schedule_date){var dt=new Date(e.schedule_date+'T00:00:00'),st=new Date(weekStart),ed=new Date(weekStart);ed.setDate(ed.getDate()+6);return dt>=st&&dt<=ed&&(dt.getDay()||7)===d}return +e.day_of_week===d}async function loadData(){all=await api('GET','/api/schedule');renderAll()}function renderAll(){renderStats();renderDetails();renderWeek();renderCalendar()}function weekEntries(){return all.filter(e=>e.status!=='cancelled'&&[1,2,3,4,5,6,7].some(d=>occurs(e,d)))}function renderStats(){var todayCnt=all.filter(e=>e.status!=='cancelled'&&((e.schedule_date&&e.schedule_date===today())||(!e.schedule_date&&+e.day_of_week===(new Date().getDay()||7)))).length;var wk=weekEntries();var main=all.filter(e=>e.status!=='cancelled'&&e.source!=='review');var done=main.filter(e=>e.status==='completed').reduce((a,e)=>a+(+e.price_per_session||0),0);var conf=main.filter(e=>e.status==='confirmed').reduce((a,e)=>a+(+e.price_per_session||0),0);var pend=main.filter(e=>e.status==='pending').reduce((a,e)=>a+(+e.price_per_session||0),0);stToday.textContent=todayCnt;stWeek.textContent=wk.length;stDoneIncome.textContent='¥'+done;stPendingMoney.textContent='¥'+conf;incomeDone.textContent='¥'+done;incomeConfirmed.textContent='¥'+conf;incomePending.textContent='¥'+pend}function renderDetails(){var reviews={};all.forEach(e=>{if(e.source==='review'&&e.parent_entry_id)reviews[e.parent_entry_id]=(reviews[e.parent_entry_id]||0)+1});var main=all.filter(e=>e.status!=='cancelled'&&e.source!=='review').sort((a,b)=>(+a.day_of_week)-(+b.day_of_week)||(a.start_time||'').localeCompare(b.start_time||''));if(!main.length){detailList.innerHTML='<div class="empty">还没有课程，先添加一节课。</div>';return}detailList.innerHTML=main.map(e=>{var cnt=reviews[e.id]||0;return '<div class="item"><span class="dot s-'+e.status+'"></span><div class="info"><b>'+days[e.day_of_week]+' '+(e.start_time||'')+'-'+endTime(e.start_time,e.duration_min)+' '+esc(e.student_name)+'</b> <span class="badge bg-'+e.status+'">'+statusText[e.status]+'</span> '+(cnt?'<span class="badge bg-review">抗遗忘×'+cnt+'</span>':'')+'<div class="meta">'+esc(e.subject_type)+' · '+(e.is_recurring?'每周重复':'单次')+(e.price_per_session?' · ¥'+e.price_per_session:'')+(e.schedule_date?' · '+e.schedule_date:'')+(e.notes?' · '+esc(e.notes):'')+'</div></div><div class="acts"><button class="btn purple xs" onclick="openReview('+e.id+')">抗遗忘</button><select onchange="changeStatus('+e.id+',this.value)"><option value="pending" '+(e.status==='pending'?'selected':'')+'>待确认</option><option value="confirmed" '+(e.status==='confirmed'?'selected':'')+'>已确认</option><option value="completed" '+(e.status==='completed'?'selected':'')+'>已完成</option></select><button class="btn out xs" onclick="editCourse('+e.id+')">编辑</button><button class="btn danger xs" onclick="deleteCourse('+e.id+')">删除</button></div></div>'}).join('')}function renderWeek(){var a=new Date(weekStart),b=new Date(weekStart);b.setDate(b.getDate()+6);weekLabel.textContent=(a.getMonth()+1)+'/'+a.getDate()+' ~ '+(b.getMonth()+1)+'/'+b.getDate();for(var i=1;i<=7;i++){var d=new Date(weekStart);d.setDate(d.getDate()+i-1);document.getElementById('th'+i).innerHTML=days[i]+'<br><small>'+(d.getMonth()+1)+'/'+d.getDate()+'</small>'}var html='';for(var m=7*60;m<=23*60+30;m+=30){var tm=String(Math.floor(m/60)).padStart(2,'0')+':'+String(m%60).padStart(2,'0');html+='<tr><td class="timecol">'+tm+'</td>';for(var d=1;d<=7;d++){var dd=new Date(weekStart);dd.setDate(dd.getDate()+d-1);var es=all.filter(e=>e.status!=='cancelled'&&occurs(e,d)&&(e.start_time||'').slice(0,5)===tm);html+='<td class="'+(iso(dd)===today()?'today':'')+'">'+es.map(e=>'<div class="entry '+(colors[e.subject_type]||'c0')+'" onclick="editCourse('+e.id+')"><b>'+(e.source==='review'?'↻ ':'')+esc(e.student_name||'?')+'</b><br><span>'+esc(e.subject_type)+' · '+endTime(e.start_time,e.duration_min)+'</span></div>').join('')+'</td>'}html+='</tr>'}weekBody.innerHTML=html}function renderCalendar(){calLabel.textContent=calYear+'年'+(calMonth+1)+'月';var first=new Date(calYear,calMonth,1),st=new Date(first);st.setDate(st.getDate()-((st.getDay()||7)-1));var html=['一','二','三','四','五','六','日'].map(x=>'<div class="ch">'+x+'</div>').join('');for(var i=0;i<42;i++){var d=new Date(st);d.setDate(st.getDate()+i);var ds=iso(d),es=all.filter(e=>e.status!=='cancelled'&&(e.schedule_date?e.schedule_date===ds:+e.day_of_week===(d.getDay()||7)));var dots=es.slice(0,4).map(e=>'<span class="d2 '+(e.source==='review'?'r':'')+'"></span>').join('');html+='<div class="day '+(d.getMonth()!==calMonth?'other':'')+' '+(ds===today()?'today':'')+'" onclick="jumpDate(\''+ds+'\')">'+d.getDate()+'<br>'+dots+'</div>'}calGrid.innerHTML=html}function jumpDate(ds){var d=new Date(ds+'T00:00:00');weekStart=startOfWeek(d);calYear=d.getFullYear();calMonth=d.getMonth();renderAll()}function changeWeek(n){weekStart.setDate(weekStart.getDate()+n*7);calYear=weekStart.getFullYear();calMonth=weekStart.getMonth();renderAll()}function goToday(){weekStart=startOfWeek(new Date());calYear=new Date().getFullYear();calMonth=new Date().getMonth();renderAll()}function closeModal(id){document.getElementById(id).classList.add('hidden')}function addCourse(){modalTitle.textContent='添加课程';editId.value='';student.value='';type.value='词汇';day.value=(new Date().getDay()||7);time.value='20:00';duration.value=60;date.value='';price.value=100;status.value='pending';recurring.checked=false;recOpts.classList.add('hidden');recurEnd.value='';recurCount.value='';notes.value='';editModal.classList.remove('hidden')}function editCourse(id){var e=all.find(x=>x.id===id);if(!e)return;modalTitle.textContent='编辑课程';editId.value=e.id;student.value=e.student_name||'';type.value=e.subject_type||'词汇';day.value=e.day_of_week||1;time.value=e.start_time||'20:00';duration.value=e.duration_min||60;date.value=e.schedule_date||'';price.value=e.price_per_session||0;status.value=e.status||'pending';recurring.checked=+e.is_recurring===1;recOpts.classList.toggle('hidden',!recurring.checked);recurEnd.value=e.recur_end_date||'';recurCount.value=e.recur_until_count||'';notes.value=e.notes||'';editModal.classList.remove('hidden')}async function saveCourse(){var id=editId.value;var data={student_name:student.value,subject_type:type.value,day_of_week:+day.value,start_time:time.value,duration_min:+duration.value||60,schedule_date:date.value||null,price_per_session:+price.value||0,status:status.value,is_recurring:recurring.checked?1:0,recur_end_date:recurEnd.value||null,recur_until_count:+recurCount.value||null,notes:notes.value};var r=id?await api('PUT','/api/schedule/'+id,data):await api('POST','/api/schedule',data);if(r.ok){toast('已保存');closeModal('editModal');loadData()}else if(r.conflict){if(confirm('这个时间和已有课程冲突，仍然添加吗？')){var r2=await api('POST','/api/schedule',Object.assign({},data,{_skip_conflict:true}));if(r2.ok){toast('已保存');closeModal('editModal');loadData()}}}else toast('保存失败')}async function deleteCourse(id){if(!confirm('确定删除这节课吗？'))return;await api('DELETE','/api/schedule/'+id+'/reviews');await api('DELETE','/api/schedule/'+id);toast('已删除');loadData()}async function changeStatus(id,v){await api('PUT','/api/schedule/'+id,{status:v});loadData()}function openReview(id){var e=all.find(x=>x.id===id);if(!e)return;reviewParent=id;reviewInfo.textContent='主课：'+(e.student_name||'')+' · '+(e.subject_type||'')+' · '+days[e.day_of_week]+' '+(e.start_time||'');baseDate.value=e.schedule_date||today();baseDate2.value=e.schedule_date||today();reviewTime.value=e.start_time||'20:00';reviewTime2.value=e.start_time||'20:00';reviewDuration.value=30;reviewDuration2.value=30;document.querySelector('input[name="preset"][value="lixiao"]').checked=true;switchPreset();renderIntervals();updateSummaries();reviewModal.classList.remove('hidden')}function switchPreset(){var v=document.querySelector('input[name="preset"]:checked').value;lxBox.classList.toggle('hidden',v!=='lixiao');customBox.classList.toggle('hidden',v!=='custom')}function summary(base,arr){var bd=new Date(base+'T00:00:00');if(isNaN(bd))return '请选择主课日期';return arr.map(n=>{var d=new Date(bd);d.setDate(d.getDate()+n);return '第'+n+'天 → '+(d.getMonth()+1)+'/'+d.getDate()+' '+days[d.getDay()||7]}).join('<br>')}function renderIntervals(){customIntervals.innerHTML=custom.map((n,i)=>'<span class="ci">第 <input type="number" value="'+n+'" onchange="custom['+i+']=+this.value||1;updateSummaries()"> 天 <span class="x" onclick="custom.splice('+i+',1);renderIntervals();updateSummaries()">×</span></span>').join('')}function addInterval(){custom.push(custom.length?custom[custom.length-1]+7:7);renderIntervals();updateSummaries()}function updateSummaries(){lxSummary.innerHTML='<b>将生成 '+lixiao.length+' 次复习：</b><br>'+summary(baseDate.value,lixiao);customSummary.innerHTML='<b>将生成 '+custom.length+' 次复习：</b><br>'+summary(baseDate2.value,custom)}baseDate.addEventListener('change',updateSummaries);baseDate2.addEventListener('change',updateSummaries);async function generateReviews(){var isL=document.querySelector('input[name="preset"]:checked').value==='lixiao';var arr=isL?lixiao:custom;var bd=isL?baseDate.value:baseDate2.value;var st=isL?reviewTime.value:reviewTime2.value;var du=+(isL?reviewDuration.value:reviewDuration2.value)||30;var r=await api('POST','/api/schedule/'+reviewParent+'/generate-reviews',{intervals:arr,schedule_date:bd,start_time:st,duration_min:du});if(r.ok){toast('已生成 '+r.created+' 次复习');closeModal('reviewModal');loadData()}else toast('生成失败')}async function clearReviews(){if(!reviewParent||!confirm('清除这节主课已生成的抗遗忘复习吗？'))return;await api('DELETE','/api/schedule/'+reviewParent+'/reviews');toast('已清除');closeModal('reviewModal');loadData()}function exportText(){var s=weekEntries().filter(e=>e.source!=='review').sort((a,b)=>+a.day_of_week-+b.day_of_week||(a.start_time||'').localeCompare(b.start_time||''));var txt='巷陌课表\n----------------\n'+s.map(e=>days[e.day_of_week]+' '+(e.start_time||'')+'-'+endTime(e.start_time,e.duration_min)+' '+(e.student_name||'')+' '+(e.subject_type||'')).join('\n');navigator.clipboard.writeText(txt).then(()=>toast('课表已复制')).catch(()=>prompt('复制课表',txt))}async function loadDemo(){if(all.length>2&&!confirm('会清空旧演示数据，继续吗？'))return;for(var i=0;i<all.length;i++){try{await api('DELETE','/api/schedule/'+all[i].id)}catch(e){}}var demo=[{student_name:'准高一女生',subject_type:'词汇',day_of_week:1,start_time:'14:00',duration_min:60,price_per_session:120,status:'confirmed',notes:'基础中等，需要耐心',is_recurring:1},{student_name:'高中男生小陈',subject_type:'阅读',day_of_week:3,start_time:'20:00',duration_min:60,price_per_session:150,status:'completed',notes:'4.6级阅读',is_recurring:1},{student_name:'高中男生小陈',subject_type:'语法',day_of_week:7,start_time:'20:00',duration_min:60,price_per_session:150,status:'confirmed',notes:'4.6级语法',is_recurring:1},{student_name:'新初一男生',subject_type:'语法',day_of_week:2,start_time:'20:00',duration_min:60,price_per_session:100,status:'pending',notes:'幽默鼓励型',is_recurring:1},{student_name:'小学三年级小美',subject_type:'听口',day_of_week:5,start_time:'19:30',duration_min:60,price_per_session:80,status:'completed',notes:'平时抗遗忘复习',is_recurring:1}];for(var j=0;j<demo.length;j++)await api('POST','/api/schedule',Object.assign({},demo[j],{_skip_conflict:true}));toast('演示数据已加载');loadData()}function toast(msg){var d=document.createElement('div');d.className='toast';d.textContent=msg;document.body.appendChild(d);setTimeout(()=>d.remove(),2200)}checkLogin().then(function(){loadData();if(location.search.includes('demo=1'))setTimeout(loadDemo,400);});
